<!doctype html>
<html lang="zh"><meta charset="utf-8"><title>Portrait fixture</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
main { width: 720px; height: 1280px; background: #11282e; color: #f5f2ea; padding: 64px; font: 36px sans-serif; }
section { position: absolute; top: 220px; left: 64px; width: 592px; }
h1 { font-size: 64px; line-height: 1.25; }
.count { font-size: 140px; color: #f4be62; }
</style>
<main id="root" data-composition-id="root" data-width="720" data-height="1280" data-duration="6">
  <p>合成示例 / SYNTHETIC</p>
  <section id="intro"><h1>让重要的信息<br>有足够的空间。</h1><p>先建立层次，再调整节奏。</p></section>
  <section id="result"><h1>Observed responses</h1><p class="count">38</p><p>Illustrative count, not a causal conclusion.</p></section>
</main>
<script src="node_modules/gsap/dist/gsap.min.js"></script>
<script>
window.__timelines = {root: gsap.timeline({paused: true})
  .from('#intro', {opacity: 0, y: 30, duration: .6}, 0)
  .to('#intro', {opacity: 0, duration: .3}, 2.5)
  .from('#result', {opacity: 0, y: 30, duration: .6}, 2.9)
  .to({}, {duration: .1}, 5.9)};
</script>
</html>
