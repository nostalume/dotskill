<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Independent parts</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="root" data-composition-id="root" data-start="0"
        data-width="1280" data-height="720" data-duration="5" data-fps="30">
    <div class="accent"></div>
    <p class="eyebrow">A MOTION STUDY</p>
    <h1>Make each part useful.</h1>
    <div class="cards">
      <section class="card" id="author"><span>01</span><h2>Author</h2><p>Keep the source editable.</p></section>
      <section class="card" id="render"><span>02</span><h2>Render</h2><p>Choose a compatible engine.</p></section>
      <section class="card" id="inspect"><span>03</span><h2>Inspect</h2><p>Check the result you need.</p></section>
    </div>
    <p class="closing">Compose the parts that fit.</p>
  </main>
  <script src="node_modules/gsap/dist/gsap.min.js"></script>
  <script src="motion.js"></script>
</body>
</html>
